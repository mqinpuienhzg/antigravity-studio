<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Antigravity Studio Rust — Desktop Live Wallpaper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #060812;
      user-select: none;
      pointer-events: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060812;
    }
    #bg-video, #bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform: translateZ(0);
      will-change: transform, filter;
    }
    #dim-layer {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
      transition: background 180ms ease;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="bg-video" autoplay loop muted playsinline preload="auto"></video>
    <img id="bg-img" alt="" />
    <div id="dim-layer"></div>
  </div>
  <script>
    (function () {
      var curMediaKey = '';
      var isPaused = false;
      var vid = document.getElementById('bg-video');
      var img = document.getElementById('bg-img');
      var dim = document.getElementById('dim-layer');

      function applyPlaybackState() {
        if (!vid || vid.style.display === 'none') return;
        try {
          if (isPaused) {
            vid.pause();
          } else {
            var p = vid.play();
            if (p && typeof p.catch === 'function') p.catch(function () {});
          }
        } catch (_) {}
      }

      window.__AGY_DESKTOP_PAUSE__ = function (paused) {
        isPaused = Boolean(paused);
        applyPlaybackState();
      };

      window.__AGY_DESKTOP_APPLY__ = function (state) {
        if (!state || !state.theme) return;
        var cfg = state.config || {};
        var th = state.theme;
        var fit = cfg.desktopObjectFit || 'cover';
        var blurPx = Math.max(0, Math.min(28, Number(cfg.desktopBlur) || 0));
        var dimPct = Math.max(0, Math.min(85, Number(cfg.desktopDimming) || 0));
        var speed = Math.max(0.25, Math.min(2.5, Number(cfg.desktopSpeed) || 1));
        var vol = Math.max(0, Math.min(1, (Number(cfg.desktopVolume) || 0) / 100));
        var url = th.mediaUrl || '';
        var isVideo = th.mediaType === 'video';
        var filterCss = blurPx > 0 ? ('blur(' + blurPx + 'px)') : 'none';
        var scaleCss = blurPx > 0 ? 'scale(1.04)' : 'scale(1)';

        dim.style.background = 'rgba(0, 0, 0, ' + (dimPct / 100).toFixed(3) + ')';

        if (isVideo && url) {
          img.style.display = 'none';
          img.removeAttribute('src');
          vid.style.display = 'block';
          vid.style.objectFit = fit;
          vid.style.filter = filterCss;
          vid.style.transform = scaleCss + ' translateZ(0)';
          vid.muted = vol <= 0.001;
          vid.volume = vol;
          vid.playbackRate = speed;

          var key = 'v:' + url;
          if (curMediaKey !== key) {
            curMediaKey = key;
            vid.src = url;
            vid.load();
          }
          applyPlaybackState();
        } else if (url) {
          vid.pause();
          vid.removeAttribute('src');
          vid.load();
          vid.style.display = 'none';
          img.style.display = 'block';
          img.style.objectFit = fit;
          img.style.filter = filterCss;
          img.style.transform = scaleCss;
          var ikey = 'i:' + url;
          if (curMediaKey !== ikey) {
            curMediaKey = ikey;
            img.src = url;
          }
        }
      };

      // Self-pull initial state on page load from Rust Axum server
      fetch('/__studio/desktop-state')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.theme) window.__AGY_DESKTOP_APPLY__(data);
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
