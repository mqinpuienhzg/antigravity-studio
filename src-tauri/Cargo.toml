[package]
name = "antigravity-studio-rust"
version = "12.1.0"
description = "Antigravity Studio Rust — Clear Liquid Glass & 60FPS Live Video Customizer for Google Antigravity IDE & Chat"
authors = ["mqinpuienhzg"]
license = "MIT"
edition = "2021"

[lib]
name = "antigravity_studio_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
rand = "0.8"
hex = "0.4"
md-5 = "0.10"
chrono = "0.4"
url = "2"
urlencoding = "2"
dirs = "6"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
